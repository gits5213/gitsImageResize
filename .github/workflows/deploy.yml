name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Choose GitHub Pages base path
        id: base
        env:
          BASE_PATH: ${{ vars.VITE_BASE_PATH }}
        run: |
          if [[ -n "${BASE_PATH}" ]]; then
            echo "path=${BASE_PATH}" >> "$GITHUB_OUTPUT"
          else
            REPO="${GITHUB_REPOSITORY#*/}"
            if [[ "$REPO" == *.github.io ]]; then
              echo "path=/" >> "$GITHUB_OUTPUT"
            else
              echo "path=/${REPO}/" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set public site origin
        id: site
        env:
          SITE_URL: ${{ vars.VITE_SITE_URL }}
        run: |
          if [[ -n "${SITE_URL}" ]]; then
            echo "origin=${SITE_URL%/}" >> "$GITHUB_OUTPUT"
          else
            echo "origin=https://${GITHUB_REPOSITORY_OWNER}.github.io" >> "$GITHUB_OUTPUT"
          fi

      - name: Build production application
        env:
          VITE_BASE_PATH: ${{ steps.base.outputs.path }}
          VITE_SITE_URL: ${{ steps.site.outputs.origin }}
          VITE_GOOGLE_SITE_VERIFICATION: ${{ vars.VITE_GOOGLE_SITE_VERIFICATION }}
          VITE_ANALYTICS_ENABLED: ${{ vars.VITE_ANALYTICS_ENABLED }}
          VITE_CF_BEACON_TOKEN: ${{ vars.VITE_CF_BEACON_TOKEN }}
          VITE_SITE_OWNER: ${{ vars.VITE_SITE_OWNER }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
          VITE_GITHUB_REPO_URL: ${{ vars.VITE_GITHUB_REPO_URL }}
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
